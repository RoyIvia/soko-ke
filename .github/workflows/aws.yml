name: Deploy Soko Kenya to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0097ef396b5616206
  APP_DIR: /opt/soko-ke

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  deploy:
    name: Deploy to EC2
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy using Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "git config --global --add safe.directory /opt/soko-ke",
              "export HOME=/root",
              "cd /opt/soko-ke",
              "git fetch origin main",
              "git reset --hard origin/main",
              "pnpm install --frozen-lockfile",
              "pnpm run build",
              "sudo systemctl restart soko-ke"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${EC2_INSTANCE_ID}"; then

            echo "SSM deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,ResponseCode:ResponseCode}'

      - name: Application Healthcheck Gate
        env:
          HEALTHCHECK_ENDPOINT: "http://100.59.186.252/api/healthz"
          MAX_RETRIES: 12
          RETRY_INTERVAL: 10
        run: |
          echo "Starting post-deployment healthcheck..."

          for ((i=1; i<=MAX_RETRIES; i++)); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTHCHECK_ENDPOINT" || true)

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "SUCCESS: Application healthcheck returned HTTP 200."
              exit 0
            fi

            echo "Attempt $i/$MAX_RETRIES failed (HTTP $HTTP_STATUS). Waiting ${RETRY_INTERVAL}s..."
            sleep "$RETRY_INTERVAL"
          done

          echo "ERROR: Application healthcheck failed after $((MAX_RETRIES * RETRY_INTERVAL)) seconds."
          exit 1
